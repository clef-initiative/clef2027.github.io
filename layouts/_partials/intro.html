{{ $gray := .Site.Params.gray | default "stone" }}

<!-- Content header -->
<header class="space-y-4 mb-6">

    <!-- Page title -->
    <h1 class="text-4xl md:text-4xl font-black text-{{ $gray }}-900 dark:text-{{ $gray }}-100 leading-tight">
        {{ .Title }}
    </h1>

    <!-- Page description -->
    {{ with .Description }}
    <p class="text-lg text-{{ $gray }}-700 dark:text-{{ $gray }}-300 leading-relaxed max-w-3xl">
        {{ . }}
    </p>
    {{ end }}

</header>
